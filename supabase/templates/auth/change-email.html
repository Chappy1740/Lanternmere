<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #0f1b2d;
      color: #d6d0c5;
      font-family: Georgia, 'Times New Roman', serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="padding: 32px 16px; background: #0f1b2d"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              background: #15263a;
              border: 1px solid #4b4a42;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td style="height: 4px; background: #f2b13d"></td>
            </tr>
            <tr>
              <td style="padding: 36px 32px">
                <p
                  style="
                    margin: 0;
                    color: #f2b13d;
                    font-size: 12px;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                  "
                >
                  A secure Lodge notice
                </p>
                <h1 style="margin: 12px 0 16px; color: #f2b13d; font-size: 30px; font-weight: 600">
                  Confirm your new email
                </h1>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.6">
                  Traveler, confirm this email address to complete the change to your Lanternmere
                  account.
                </p>
                <p style="margin: 0 0 28px">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="
                      display: inline-block;
                      padding: 13px 22px;
                      border-radius: 6px;
                      background: #f2b13d;
                      color: #101820;
                      font-family: Arial, sans-serif;
                      font-size: 15px;
                      font-weight: 700;
                      text-decoration: none;
                    "
                    >Confirm email change</a
                  >
                </p>
                <p
                  style="
                    margin: 0;
                    color: #a49a8c;
                    font-family: Arial, sans-serif;
                    font-size: 13px;
                    line-height: 1.5;
                  "
                >
                  If you did not request this change, you can safely ignore this message.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
